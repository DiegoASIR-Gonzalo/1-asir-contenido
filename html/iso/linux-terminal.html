<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritorio Linux · Guía de comandos</title>
<style>
  /* ============ COLORES (cámbialos aquí) ============ */
  :root{
    --escritorio-1:#2c001e; --escritorio-2:#5e2750;   /* fondo del escritorio */
    --barra:#1a1a1a;                                  /* barra superior */
    --ventana:#2e2c33; --lateral:#38353f;             /* marco de la ventana y panel lateral */
    --acento:#e95420;                                 /* elemento activo */
    --term:#300a24; --term-txt:#eeeeec;               /* terminal */
    --usuario:#8ae234; --ruta:#729fcf; --carpeta:#729fcf; --exec:#8ae234; --marca:#fce94f;
    --kw:#ad7fa8; --str:#e9b96e; --com:#888a85;       /* resaltado de código (.bashrc) */
    --papel:#f6f5f4; --papel-txt:#241f31;             /* zona de explicación */
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font:15px/1.5 Ubuntu,Cantarell,"Segoe UI",system-ui,sans-serif;color:#fff;
    /* 1.ª capa: imagen de fondo (variable --fondo-img, la rellena el script); 2.ª capa: degradado de respaldo */
    background:var(--fondo-img,none) center/cover no-repeat fixed,linear-gradient(135deg,var(--escritorio-1),var(--escritorio-2)) fixed;
    display:flex;flex-direction:column}
  :focus-visible{outline:2px solid var(--marca);outline-offset:2px}

  /* Barra superior tipo GNOME */
  .barra{background:var(--barra);height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:13px}
  .barra b{font-weight:500}

  /* Ventana */
  .ventana{flex:1;min-height:0;margin:18px auto;width:min(1100px,calc(100% - 24px));display:flex;flex-direction:column;
    background:var(--ventana);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.55)}
  .titulo{height:42px;display:flex;align-items:center;justify-content:center;position:relative;font-weight:700;font-size:14px}
  .titulo i{position:absolute;right:14px;width:22px;height:22px;border-radius:50%;background:#4a4752;font-style:normal;text-align:center;line-height:22px;font-size:12px}
  .cuerpo{flex:1;min-height:0;display:grid;grid-template-columns:230px 1fr}

  /* Panel lateral */
  .lateral{background:var(--lateral);overflow:auto;padding:10px 8px}
  details{margin-bottom:6px}
  summary{cursor:pointer;padding:6px 10px;font-weight:700;font-size:13px;color:#c0bfbc;list-style:none;border-radius:6px}
  summary::before{content:"▾ "}
  details:not([open]) summary::before{content:"▸ "}
  summary:hover{background:rgba(255,255,255,.07)}
  .items{overflow:hidden} /* recorta los subapartados mientras se pliegan con desvanecimiento */
  .item{display:flex;justify-content:space-between;gap:8px;align-items:baseline;width:100%;text-align:left;
    background:none;border:0;color:#fff;font:inherit;padding:7px 10px 7px 22px;border-radius:6px;cursor:pointer}
  .item small{color:#c0bfbc;font-size:12px;white-space:nowrap}
  .item:hover{background:rgba(255,255,255,.08)}
  .item.activo{background:var(--acento)}
  .item.activo small{color:#fff}
  .item code{font-family:"Ubuntu Mono","DejaVu Sans Mono",monospace;font-size:14px}

  /* Zona principal: terminal + explicación */
  .principal{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--papel)}
  .terminal{background:var(--term);color:var(--term-txt);display:flex;flex-direction:column;flex:0 0 52%;min-height:210px}
  .pantalla{flex:1;overflow:auto;padding:16px 18px;font:15px/1.55 "Ubuntu Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
  .u{color:var(--usuario);font-weight:700}.r{color:var(--ruta);font-weight:700}
  .d{color:var(--carpeta);font-weight:700}.x{color:var(--exec);font-weight:700}
  mark{background:none;color:var(--marca);font-weight:700}
  .k{color:var(--kw);font-weight:700}.s{color:var(--str)}.c{color:var(--com)}   /* código: palabra clave, texto, comentario */
  .cursor{display:inline-block;width:.6em;height:1.1em;background:var(--term-txt);vertical-align:text-bottom;animation:parpadeo 1s steps(1) infinite}
  @keyframes parpadeo{50%{opacity:0}}

  /* Botones en las esquinas inferiores de la terminal */
  .pie{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid rgba(255,255,255,.1)}
  .pie button{font:inherit;font-weight:700;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);padding:7px 16px;border-radius:8px;cursor:pointer}
  .pie button:hover:not(:disabled){background:var(--acento);border-color:var(--acento)}
  .pie button:disabled{opacity:.35;cursor:default}
  .contador{font:13px "Ubuntu Mono",monospace;color:#c0bfbc}

  /* Explicación */
  .explicacion{flex:1;overflow:auto;padding:18px 24px;color:var(--papel-txt);max-width:78ch}
  .explicacion h3{font-size:18px;margin-bottom:6px}
  .explicacion p{margin-bottom:8px}
  .explicacion code{font:14px "Ubuntu Mono","DejaVu Sans Mono",monospace;background:#e1dedb;padding:1px 6px;border-radius:4px}
  .explicacion ul{padding-left:20px}

  @media (max-width:720px){
    .cuerpo{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .lateral{max-height:34vh}
  }
  /* Transición suave solo en el panel lateral (resaltado del comando activo) */
  .item{transition:background .2s ease}

  /* Botón cuadriculado y panel de personalización */
  .ventana{position:relative}
  .ajustes-btn{position:absolute;left:10px;top:6px;width:30px;height:30px;display:grid;place-items:center;background:#4a4752;color:#fff;border:0;border-radius:8px;cursor:pointer}
  .ajustes-btn:hover,.ajustes-btn[aria-expanded="true"]{background:var(--acento)}
  .ajustes{position:absolute;left:10px;top:46px;z-index:5;width:min(290px,calc(100% - 20px));max-height:calc(100% - 56px);overflow:auto;
    background:#3d3a45;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:14px;box-shadow:0 12px 32px rgba(0,0,0,.5);font-size:14px}
  .ajustes h2{font-size:15px;margin-bottom:10px}
  .ajustes .fila{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .ajustes select,.ajustes .reset{font:inherit;background:#2e2c33;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:4px 8px}
  .ajustes input[type=color]{width:42px;height:26px;padding:0;border:1px solid rgba(255,255,255,.25);border-radius:6px;background:none;cursor:pointer}
  .ajustes .vel{display:block}
  .ajustes .vel input{width:100%}
  .ajustes .vel small{color:#c0bfbc}
  .ajustes .reset{margin-top:6px;cursor:pointer}
  .ajustes .reset:hover{background:var(--acento);border-color:var(--acento)}
  .ajustes .fila .reset{margin:0;flex:1}
  .ajustes h3{font-size:13px;margin:12px 0 6px;color:#c0bfbc}

  /* Los botones de la terminal siguen los colores elegidos (así se leen también con un tema claro) */
  .pie{border-top-color:color-mix(in srgb,var(--term-txt) 20%,transparent)}
  .pie button{color:var(--term-txt);background:color-mix(in srgb,var(--term-txt) 12%,transparent);border-color:color-mix(in srgb,var(--term-txt) 25%,transparent)}
  .pie button:hover:not(:disabled){color:#fff}
  .contador{color:var(--term-txt);opacity:.7}

  /* ===== Botón "Actividades" de la barra superior y su panel lateral ===== */
  .barra-btn{font:inherit;font-weight:500;color:#fff;background:none;border:0;border-radius:12px;height:24px;padding:0 12px;cursor:pointer;transition:background .2s ease}
  .barra-btn:hover,.barra-btn[aria-expanded="true"]{background:rgba(255,255,255,.14)}
  .act-panel{position:fixed;left:0;top:30px;bottom:0;z-index:15;width:min(310px,88vw);display:flex;flex-direction:column;
    background:var(--lateral);border-right:1px solid rgba(255,255,255,.12);box-shadow:8px 0 28px rgba(0,0,0,.45);
    transform:translateX(-100%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
  .act-panel.abierto{transform:none;visibility:visible;transition:transform .22s ease}
  .act-cab{padding:14px 16px 10px}
  .act-cab h2{font-size:15px}
  .act-cab p{font-size:12px;color:#c0bfbc;margin-top:2px}
  .act-lista{flex:1;overflow:auto;padding:4px 8px}
  .act-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#fff;font:inherit;padding:9px 10px;border-radius:8px;cursor:pointer;transition:background .2s ease}
  .act-item:hover{background:rgba(255,255,255,.08)}
  .act-num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#4a4752;font-size:12px;font-weight:700}
  .act-item.hecha .act-num{background:#26a269}
  .act-txt{display:flex;flex-direction:column;min-width:0}
  .act-txt b{font-weight:700}
  .act-txt small{color:#c0bfbc;font-size:12px}
  .act-pie{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#c0bfbc}
  .act-pie button{font:inherit;background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer}
  .act-pie button:hover{color:#fff}

  /* ===== Ventana de actividad: enunciado + terminal (misma terminal que la principal) ===== */
  /* La ventana flota sobre el escritorio (sin fondo oscuro): la posición y el tamaño los pone el script */
  .act-fondo{position:fixed;inset:0;z-index:30;pointer-events:none}
  .act-fondo[hidden],.entrada[hidden]{display:none}
  .act-ventana{position:absolute;pointer-events:auto;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.55);
    opacity:0;transform:scale(.97);transition:opacity .22s ease,transform .22s ease}
  /* Velo que oscurece el escritorio (solo visual: no bloquea los clics). Aparece y desaparece con suavidad */
  .act-velo{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .28s ease}
  .act-fondo.visible .act-velo{opacity:1}
  .act-fondo.visible .act-ventana{opacity:1;transform:none}
  .act-ventana.maximizada,.act-ventana.maximizada .act-int{border-radius:0}
  .act-int{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;border-radius:12px;background:var(--ventana)}
  .act-ventana .titulo{flex:none;user-select:none;touch-action:none;cursor:default}
  .act-ventana .titulo span{min-width:0;max-width:100%;padding:0 84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act-cerrar,.act-max{position:absolute;width:22px;height:22px;padding:0;border:0;border-radius:50%;background:#4a4752;color:#fff;font-size:12px;line-height:22px;text-align:center;cursor:pointer}
  .act-cerrar{right:14px}
  .act-max{right:42px}
  .act-cerrar:hover,.act-max:hover{background:var(--acento)}
  /* Tiradores para cambiar el tamaño: bordes y esquinas, justo por fuera del borde de la ventana */
  .res{position:absolute;z-index:3;touch-action:none}
  .res.n{top:-4px;left:12px;right:12px;height:8px;cursor:ns-resize}
  .res.s{bottom:-4px;left:12px;right:12px;height:8px;cursor:ns-resize}
  .res.e{right:-4px;top:12px;bottom:12px;width:8px;cursor:ew-resize}
  .res.w{left:-4px;top:12px;bottom:12px;width:8px;cursor:ew-resize}
  .res.ne{top:-4px;right:-4px;width:16px;height:16px;cursor:nesw-resize}
  .res.nw{top:-4px;left:-4px;width:16px;height:16px;cursor:nwse-resize}
  .res.se{bottom:-4px;right:-4px;width:16px;height:16px;cursor:nwse-resize}
  .res.sw{bottom:-4px;left:-4px;width:16px;height:16px;cursor:nesw-resize}
  .act-ventana.maximizada .res{display:none}
  .act-cuerpo{flex:1;min-height:0;display:flex;flex-direction:column}
  .enunciado{flex:0 1 auto;max-height:55%;overflow:auto;background:var(--papel);color:var(--papel-txt);padding:16px 24px}
  .enunciado h3{font-size:18px;margin-bottom:6px}
  .enunciado p{margin-bottom:8px}
  .enunciado code{font:14px "Ubuntu Mono","DejaVu Sans Mono",monospace;background:#e1dedb;padding:1px 6px;border-radius:4px}
  .enunciado pre{font:14px/1.5 "Ubuntu Mono","DejaVu Sans Mono",monospace;background:#e1dedb;padding:8px 12px;border-radius:6px;margin:6px 0 8px;overflow:auto}
  .tareas{list-style:none;padding:0;margin-top:6px}
  .tareas li{position:relative;padding:3px 0 3px 26px;opacity:.6}
  .tareas li::before{content:"☐";position:absolute;left:0}
  .tareas li.actual{opacity:1;font-weight:700}
  .tareas li.actual::before{color:var(--acento)}
  .tareas li.hecha{opacity:1}
  .tareas li.hecha::before{content:"☑";color:#26a269}
  .exito{margin-top:10px;padding:8px 12px;border-radius:8px;background:#d7f0e0;color:#14532d;font-weight:700}
  .act-term{flex:1 1 0;min-height:140px}             /* sustituye el 52 % de la terminal principal */
  .act-term .pantalla{cursor:text}
  .entrada{display:flex;align-items:baseline}
  .entrada input{flex:1;min-width:0;font:inherit;color:inherit;background:none;border:0;padding:0;caret-color:var(--term-txt)}
  .entrada input:focus-visible{outline:none}

  @media (prefers-reduced-motion:reduce){.cursor{animation:none}.item{transition:none}.act-panel,.act-panel.abierto{transition:none}.act-item,.barra-btn{transition:none}.act-velo,.act-ventana{transition:none}}
</style>
</head>
<body>

<div class="barra">
  <!-- Botón "Actividades": abre/cierra el panel lateral con las actividades -->
  <button class="barra-btn" id="btn-act" type="button" aria-expanded="false" aria-controls="panel-act">Actividades</button>
  <span id="reloj"></span><span>ES ⏻</span>
</div>

<main class="ventana">
  <div class="titulo">
    <!-- Botón cuadriculado (esquina superior izquierda): abre el panel de personalización -->
    <button class="ajustes-btn" id="btn-ajustes" aria-label="Personalizar terminal" aria-expanded="false" aria-controls="panel-ajustes">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <rect x="1" y="1" width="4" height="4" rx="1"/><rect x="6" y="1" width="4" height="4" rx="1"/><rect x="11" y="1" width="4" height="4" rx="1"/>
        <rect x="1" y="6" width="4" height="4" rx="1"/><rect x="6" y="6" width="4" height="4" rx="1"/><rect x="11" y="6" width="4" height="4" rx="1"/>
        <rect x="1" y="11" width="4" height="4" rx="1"/><rect x="6" y="11" width="4" height="4" rx="1"/><rect x="11" y="11" width="4" height="4" rx="1"/>
      </svg>
    </button>
    <span id="titulo-ventana">Terminal</span><i aria-hidden="true">✕</i>
  </div>

  <!-- Panel de personalización (los colores se generan desde AJUSTES_COLORES en el script) -->
  <div class="ajustes" id="panel-ajustes" hidden>
    <h2>Personalizar terminal</h2>
    <label class="fila">Tema <select id="tema"></select></label>
    <div id="colores"></div>
    <label class="fila vel">Tiempo de escritura: <span id="vel-txt"></span>
      <input type="range" id="vel" min="0" max="120" step="4">
      <small>0 = el comando aparece de golpe</small>
    </label>
    <h3>Fondo de pantalla</h3>
    <div class="fila">
      <button class="reset" id="fondo-elegir" type="button">Elegir imagen…</button>
      <button class="reset" id="fondo-quitar" type="button">Quitar</button>
    </div>
    <input type="file" id="fondo-archivo" accept="image/*" hidden>
    <button class="reset" id="restablecer">Restablecer todo</button>
  </div>
  <div class="cuerpo">
    <!-- El panel lateral se genera solo a partir de GRUPOS (ver más abajo) -->
    <nav class="lateral" id="lateral" aria-label="Comandos"></nav>

    <section class="principal">
      <div class="terminal">
        <div class="pantalla" id="pantalla" aria-live="polite"></div>
        <div class="pie">
          <button id="ant">◀ Anterior</button>
          <span class="contador" id="contador"></span>
          <button id="sig">Siguiente ▶</button>
        </div>
      </div>
      <article class="explicacion" id="explicacion"></article>
    </section>
  </div>
</main>

<!-- Pestaña lateral de actividades (la lista se genera desde ACTIVIDADES en el script) -->
<aside class="act-panel" id="panel-act" aria-label="Actividades">
  <div class="act-cab"><h2>Actividades</h2><p>Practica tú mismo: escribe los comandos en la terminal.</p></div>
  <div class="act-lista" id="act-lista"></div>
  <div class="act-pie"><span id="act-progreso"></span><button type="button" id="act-borrar">Borrar progreso</button></div>
</aside>

<!-- Ventana de una actividad: enunciado arriba y terminal interactiva debajo.
     Flota sobre el escritorio: se mueve arrastrando la barra de título y se redimensiona desde bordes y esquinas
     (los tiradores .res los crea el script). -->
<div class="act-fondo" id="act-fondo" hidden>
  <div class="act-velo" aria-hidden="true"></div>
  <section class="act-ventana" id="act-ventana" role="dialog" aria-labelledby="act-titulo">
    <div class="act-int">
      <div class="titulo" id="act-barra" tabindex="0" role="group" aria-label="Barra de título. Flechas: mover la ventana. Mayús + flechas: cambiar su tamaño">
        <span id="act-titulo"></span>
        <button class="act-max" id="act-max" type="button" aria-label="Maximizar ventana">□</button>
        <button class="act-cerrar" id="act-cerrar" type="button" aria-label="Cerrar actividad">✕</button>
      </div>
      <div class="act-cuerpo">
        <article class="enunciado" id="act-enunciado"></article>
        <div class="terminal act-term">
          <div class="pantalla" id="act-pantalla">
            <span id="act-hist" aria-live="polite"></span>
            <div class="entrada" id="act-linea">
              <span id="act-prompt"></span>
              <input id="act-in" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Escribe un comando">
            </div>
          </div>
          <div class="pie">
            <button id="act-reiniciar" type="button">↺ Reiniciar</button>
            <span class="contador" id="act-contador"></span>
            <button id="act-pista" type="button">💡 Pista</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
/* =====================================================================
   CÓMO AÑADIR CONTENIDO (solo tocas este bloque)
   ---------------------------------------------------------------------
   GRUPOS      → cada grupo es una sección desplegable del panel lateral.
   comandos    → cada comando es un subapartado clicable dentro del grupo.
   diapositivas→ la 1.ª explica el comando; las siguientes, ejemplos.
   Cada diapositiva tiene:
     cmd : texto que se "teclea" en la terminal
     out : salida del comando (HTML). Clases útiles:
           <b class="d">carpeta</b>  <b class="x">ejecutable</b>  <mark>resaltado</mark>
           <span class="u">usuario@linux</span>:<span class="r">~/ruta</span>$
     exp : explicación bajo la terminal (HTML: <h3>, <p>, <code>, <ul>)
   VARIOS COMANDOS EN CADENA: en vez de cmd/out usa pasos, una lista de {cmd, out, ruta}.
   Se teclean uno tras otro, como una sesión real. "ruta" (opcional) cambia el prompt
   tras ese paso (útil con cd), p. ej. ruta:"~/proyectos".
   Ejemplo: { pasos:[ {cmd:"cd web", ruta:"~/web"}, {cmd:"ls", out:"index.html"} ], exp:"..." }
   CÓDIGO (funciones de ~/.bashrc): dentro de out usa <span class="k">palabra clave</span>,
   <span class="s">"texto"</span> y <span class="c"># comentario</span>. Para mostrar < y > escribe &lt; y &gt;.

   Plantilla para copiar y pegar un comando nuevo:

   { nombre:"mkdir", resumen:"Crear carpetas", diapositivas:[
       { cmd:"mkdir fotos", out:"", exp:"<h3>mkdir</h3><p>Crea una carpeta.</p>" },
       { cmd:"mkdir -p a/b/c", out:"", exp:"<p>Con <code>-p</code> crea toda la ruta.</p>" }
   ]},
   ===================================================================== */
const prompt = ruta => '<span class="u">usuario@linux</span>:<span class="r">' + ruta + '</span>$ '; // texto antes del comando

// Imagen de fondo por defecto: ruta o URL, p. ej. "fondo.jpg" o "img/escritorio.png".
// Déjala vacía ("") para usar el degradado de color. Desde el botón cuadriculado también se puede elegir otra imagen.
const FONDO_IMAGEN = "";

const GRUPOS = [

  { titulo:"Consultar comandos", comandos:[

    { nombre:"type", resumen:"Tipo de comando", diapositivas:[
      { cmd:"type nano",
        out:'nano is /usr/bin/nano',
        exp:'<h3>type</h3><p>Muestra que tipo de comando es el que queremos saber</p><p>Te dice ademas en donde esta alojado el comando o incluso si es interno.</p>' },
      { cmd:"type nano (pero si fuera un alias)",
        out:'nano es un alias de nano -l',
        exp:'<h3>¿Que pasaría si fuera un alias?</h3><p>Solamente nos especificaría que es un alias y no el comando en si.</p>' },
      { cmd:"type pwd",
        out:'pwd es una orden interna del shell',
        exp:'<p>Esto es lo que sucede cuando estamos ante un comando interno, nos especifica que es de la <strong>bash</strong></p>' }
    ]},

    { nombre:"man", resumen:"Manual de comandos", diapositivas:[
      { cmd:"man",
        out:'¿Qué página del manual desea?<p>Por ejemplo, pruebe man man.</p>',
        exp:'<h3>El manual universal</h3><p>Podremos consultar casi cualquier comando con "man", pero habra otros que no ya que dependa si tiene o no dentro de man.</p>' },
	  { cmd:"man -k whoami",
        out:'whoami (1)           - print effective user name',

/* ---------------- Lógica (no hace falta tocarla) ---------------- */
const $ = id => document.getElementById(id);
const reducido = matchMedia('(prefers-reduced-motion: reduce)').matches;
const espera = ms => new Promise(r => setTimeout(r, ms));
let g = 0, c = 0, s = 0, turno = 0;

// Construye el panel lateral
GRUPOS.forEach((gr, gi) => {
  const det = document.createElement('details'); det.open = true;
  det.innerHTML = '<summary></summary><div class="items"></div>';
  const resumen = det.firstChild, caja = det.lastChild;
  resumen.textContent = gr.titulo;
  resumen.onclick = e => { e.preventDefault(); alternarGrupo(det, caja); }; // plegar/desplegar con desvanecimiento
  gr.comandos.forEach((cm, ci) => {
    const b = document.createElement('button');
    b.className = 'item'; b.dataset.g = gi; b.dataset.c = ci;
    b.innerHTML = '<code></code><small></small>';
    b.children[0].textContent = cm.nombre; b.children[1].textContent = cm.resumen;
    b.onclick = () => abrir(gi, ci);
    caja.appendChild(b);
  });
  $('lateral').appendChild(det);
});

// Pliega o despliega un grupo del panel lateral: los subapartados se desvanecen y encogen (220 ms)
function alternarGrupo(det, caja){
  if (reducido){ det.open = !det.open; return; }
  if (caja.getAnimations().length) return;           // ya se está animando
  const alto = caja.offsetHeight + 'px';
  if (det.open){
    const a = caja.animate([{opacity:1, height:alto}, {opacity:0, height:'0px'}], {duration:220, easing:'ease', fill:'forwards'});
    a.onfinish = () => { det.open = false; a.cancel(); };
  } else {
    det.open = true;
    caja.animate([{opacity:0, height:'0px'}, {opacity:1, height:caja.offsetHeight + 'px'}], {duration:220, easing:'ease'});
  }
}

function abrir(gi, ci){ g = gi; c = ci; s = 0; pintar(); }
function ir(d){
  const n = GRUPOS[g].comandos[c].diapositivas.length;
  s = Math.min(n - 1, Math.max(0, s + d)); pintar();
}

async function pintar(){
  const cm = GRUPOS[g].comandos[c], dia = cm.diapositivas[s], mio = ++turno;
  document.querySelectorAll('.item').forEach(b => b.classList.toggle('activo', +b.dataset.g === g && +b.dataset.c === c));
  $('titulo-ventana').textContent = 'usuario@linux: ~ — ' + cm.nombre;
  $('contador').textContent = (s === 0 ? 'Explicación' : 'Ejemplo ' + s) + ' · ' + (s + 1) + ' / ' + cm.diapositivas.length;
  $('ant').disabled = s === 0; $('sig').disabled = s === cm.diapositivas.length - 1;
  $('explicacion').innerHTML = dia.exp;

  // Terminal: escribe el comando letra a letra y luego muestra la salida
  // Una diapositiva puede ser un solo comando (cmd/out/ruta) o varios en cadena (pasos)
  const pasos = dia.pasos || [{ cmd: dia.cmd, out: dia.out, ruta: dia.ruta }];
  const esc = t => Object.assign(document.createElement('div'), { textContent: t }).innerHTML;
  const instantaneo = reducido || ajustes.vel === 0;
  const p = $('pantalla'); let hecho = '', ruta = '~';
  for (const paso of pasos){
    p.innerHTML = hecho + prompt(ruta) + '<span id="tec"></span><span class="cursor"></span>';
    const tec = $('tec');
    if (instantaneo) tec.textContent = paso.cmd;
    else for (const ch of paso.cmd){ if (mio !== turno) return; tec.textContent += ch; await espera(ajustes.vel); }
    hecho += prompt(ruta) + esc(paso.cmd) + '\n' + (paso.out ? paso.out + '\n' : '');
    if (paso.ruta) ruta = paso.ruta;
    p.innerHTML = hecho; p.scrollTop = p.scrollHeight;
    if (!instantaneo){ await espera(350); } // pausa entre comandos de la cadena
    if (mio !== turno) return;
  }
  p.innerHTML = hecho + prompt(ruta) + '<span class="cursor"></span>';
  p.scrollTop = p.scrollHeight;
}

$('ant').onclick = () => ir(-1);
$('sig').onclick = () => ir(1);
addEventListener('keydown', e => {
  if (/INPUT|SELECT/.test(e.target.tagName)) return; // no cambiar de diapositiva al usar el panel de ajustes
  if (e.target.closest('.act-ventana')) return; // ni al usar la ventana de una actividad
  if (e.key === 'ArrowLeft') ir(-1); if (e.key === 'ArrowRight') ir(1);
});

// Reloj de la barra superior
const reloj = () => $('reloj').textContent = new Date().toLocaleString('es-ES', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
reloj(); setInterval(reloj, 30000);

/* ---------------- Panel de personalización ----------------
   EDITABLE: añade colores a AJUSTES_COLORES (v = variable CSS de :root, t = etiqueta)
   o temas a TEMAS (cada tema da un valor #rrggbb a cada variable). */
const AJUSTES_COLORES = [
  {v:'--term', t:'Fondo'}, {v:'--term-txt', t:'Texto'}, {v:'--usuario', t:'Usuario'},
  {v:'--ruta', t:'Ruta'}, {v:'--carpeta', t:'Carpetas'}, {v:'--exec', t:'Ejecutables'}, {v:'--marca', t:'Resaltado'},
  {v:'--kw', t:'Código: palabras clave'}, {v:'--str', t:'Código: textos'}, {v:'--com', t:'Código: comentarios'}
];
const TEMAS = {
  'Ubuntu':     {'--term':'#300a24','--term-txt':'#eeeeec','--usuario':'#8ae234','--ruta':'#729fcf','--carpeta':'#729fcf','--exec':'#8ae234','--marca':'#fce94f','--kw':'#ad7fa8','--str':'#e9b96e','--com':'#888a85'},
  'Matrix':     {'--term':'#000000','--term-txt':'#39ff14','--usuario':'#39ff14','--ruta':'#00c853','--carpeta':'#00e5ff','--exec':'#b2ff59','--marca':'#ffeb3b','--kw':'#76ff03','--str':'#ffee58','--com':'#2e7d32'},
  'Solarizado': {'--term':'#002b36','--term-txt':'#93a1a1','--usuario':'#859900','--ruta':'#268bd2','--carpeta':'#2aa198','--exec':'#b58900','--marca':'#cb4b16','--kw':'#6c71c4','--str':'#b58900','--com':'#586e75'},
  'Claro':      {'--term':'#fafafa','--term-txt':'#2e3436','--usuario':'#4e9a06','--ruta':'#3465a4','--carpeta':'#3465a4','--exec':'#4e9a06','--marca':'#c4a000','--kw':'#75507b','--str':'#8f5902','--com':'#6e7371'}
};
const VEL_DEFECTO = 24; // milisegundos por letra
// fondo: "" = usar FONDO_IMAGEN · "ninguna" = solo degradado · otro valor = imagen elegida por la persona (data URL)
const ajustes = { colores:{...TEMAS.Ubuntu}, vel:VEL_DEFECTO, fondo:'' };

// Recupera lo guardado (si el navegador lo permite)
try {
  const guardado = JSON.parse(localStorage.getItem('ajustes-terminal'));
  if (guardado){ Object.assign(ajustes.colores, guardado.colores); ajustes.vel = guardado.vel ?? VEL_DEFECTO; }
  ajustes.fondo = localStorage.getItem('fondo-terminal') || '';
} catch (e) {}
// La imagen se guarda aparte: si no cupiera, los colores y la velocidad se conservan igualmente
const guardar = () => {
  try { localStorage.setItem('ajustes-terminal', JSON.stringify({ colores: ajustes.colores, vel: ajustes.vel })); } catch (e) {}
  try { if (ajustes.fondo) localStorage.setItem('fondo-terminal', ajustes.fondo); else localStorage.removeItem('fondo-terminal'); } catch (e) {}
};

// Aplica los ajustes a la página y sincroniza los controles
function aplicar(){
  for (const k in ajustes.colores) document.documentElement.style.setProperty(k, ajustes.colores[k]);
  const imagen = ajustes.fondo === 'ninguna' ? '' : (ajustes.fondo || FONDO_IMAGEN);
  document.documentElement.style.setProperty('--fondo-img', imagen ? 'url("' + imagen + '")' : 'none');
  AJUSTES_COLORES.forEach((o, i) => $('col' + i).value = ajustes.colores[o.v]);
  $('vel').value = ajustes.vel;
  $('vel-txt').textContent = ajustes.vel ? ajustes.vel + ' ms por letra' : 'instantáneo';
}

// Selectores de color
AJUSTES_COLORES.forEach((o, i) => {
  const fila = document.createElement('label'); fila.className = 'fila'; fila.append(o.t);
  const inp = document.createElement('input'); inp.type = 'color'; inp.id = 'col' + i;
  inp.oninput = () => { ajustes.colores[o.v] = inp.value; aplicar(); guardar(); };
  fila.append(inp); $('colores').append(fila);
});

// Temas predefinidos
$('tema').innerHTML = '<option value="">Elegir tema…</option>';
Object.keys(TEMAS).forEach(n => { const op = document.createElement('option'); op.value = op.textContent = n; $('tema').append(op); });
$('tema').onchange = () => {
  if (!$('tema').value) return;
  ajustes.colores = {...TEMAS[$('tema').value]}; $('tema').value = '';
  aplicar(); guardar();
};

// Velocidad: se actualiza al mover y, al soltar, repite el comando para que veas el resultado
$('vel').oninput = () => { ajustes.vel = +$('vel').value; aplicar(); };
$('vel').onchange = () => { guardar(); pintar(); };

$('restablecer').onclick = () => { ajustes.colores = {...TEMAS.Ubuntu}; ajustes.vel = VEL_DEFECTO; ajustes.fondo = ''; aplicar(); guardar(); pintar(); };

// Abrir y cerrar el panel (botón, clic fuera o Escape)
const btnAjustes = $('btn-ajustes'), panel = $('panel-ajustes');
function alternar(abierto){ panel.hidden = !abierto; btnAjustes.setAttribute('aria-expanded', abierto); }
btnAjustes.onclick = () => alternar(panel.hidden);
addEventListener('keydown', e => { if (e.key === 'Escape') alternar(false); });
addEventListener('click', e => { if (!panel.hidden && !panel.contains(e.target) && !btnAjustes.contains(e.target)) alternar(false); });

// Fondo de pantalla: se reduce a 1920 px como máximo para que ocupe poco y se pueda guardar
function cargarImagen(archivo){
  const img = new Image(), url = URL.createObjectURL(archivo);
  img.onload = () => {
    const k = Math.min(1, 1920 / Math.max(img.width, img.height));
    const lienzo = document.createElement('canvas');
    lienzo.width = Math.round(img.width * k); lienzo.height = Math.round(img.height * k);
    lienzo.getContext('2d').drawImage(img, 0, 0, lienzo.width, lienzo.height);
    ajustes.fondo = lienzo.toDataURL('image/jpeg', .85);
    URL.revokeObjectURL(url); aplicar(); guardar();
  };
  img.src = url;
}
$('fondo-elegir').onclick = () => $('fondo-archivo').click();
$('fondo-archivo').onchange = e => { const f = e.target.files[0]; if (f) cargarImagen(f); e.target.value = ''; };
$('fondo-quitar').onclick = () => { ajustes.fondo = 'ninguna'; aplicar(); guardar(); };

/* ---------------- Actividades: panel lateral + ventana con terminal interactiva ---------------- */
const btnAct = $('btn-act'), panelAct = $('panel-act'), fondoAct = $('act-fondo');
const entradaAct = $('act-in'), histoAct = $('act-hist'), pantAct = $('act-pantalla');
// Subapartados: se agrupan por el campo "grupo" (en orden de aparición); ORDEN_ACT es la lista plana en ese mismo orden
const GRUPOS_ACT = [];
ACTIVIDADES.forEach(a => {
  const nombre = a.grupo || 'General';
  let gr = GRUPOS_ACT.find(x => x.titulo === nombre);
  if (!gr) GRUPOS_ACT.push(gr = { titulo: nombre, items: [] });
  gr.items.push(a);
});
const ORDEN_ACT = GRUPOS_ACT.flatMap(gr => gr.items);
const escapar = t => Object.assign(document.createElement('div'), { textContent: t }).innerHTML;
const normalizar = t => t.trim().replace(/\s+/g, ' ');

// Actividades completadas (se recuerdan si el navegador lo permite)
let hechas = [];
try { hechas = JSON.parse(localStorage.getItem('actividades-hechas')) || []; } catch (e) {}
const guardarHechas = () => { try { localStorage.setItem('actividades-hechas', JSON.stringify(hechas)); } catch (e) {} };

// Estado de la actividad abierta
let act = null, actI = 0, pasoAct = 0, rutaAct = '~', histAct = '', fallosAct = 0, hechaAct = false, mem = [], memI = 0;

// Lista del panel lateral
function construirLista(){
  const lista = $('act-lista');
  // al reconstruir se recuerdan los subapartados que estaban plegados
  const plegados = new Set([...lista.querySelectorAll('details')].filter(d => !d.open).map(d => d.dataset.t));
  lista.innerHTML = '';
  GRUPOS_ACT.forEach(gr => {
    const det = document.createElement('details'); det.dataset.t = gr.titulo; det.open = !plegados.has(gr.titulo);
    det.innerHTML = '<summary></summary><div class="items"></div>';
    const resumen = det.firstChild, caja = det.lastChild;
    const hechasGr = gr.items.filter(a => hechas.includes(a.id)).length;
    resumen.textContent = gr.titulo + ' · ' + hechasGr + '/' + gr.items.length;
    resumen.onclick = e => { e.preventDefault(); alternarGrupo(det, caja); }; // mismo plegado con desvanecimiento que el panel principal
    gr.items.forEach(a => {
      const i = ORDEN_ACT.indexOf(a), ok = hechas.includes(a.id), b = document.createElement('button');
      b.type = 'button'; b.className = 'act-item' + (ok ? ' hecha' : '');
      b.innerHTML = '<span class="act-num"></span><span class="act-txt"><b></b><small></small></span>';
      b.children[0].textContent = ok ? '✓' : i + 1;
      b.children[1].children[0].textContent = a.titulo;
      b.children[1].children[1].textContent = a.resumen + ' · ' + a.pasos.length + (a.pasos.length === 1 ? ' paso' : ' pasos') + (ok ? ' · completada' : '');
      b.onclick = () => abrirAct(i);
      caja.append(b);
    });
    lista.append(det);
  });
  $('act-progreso').textContent = ORDEN_ACT.filter(a => hechas.includes(a.id)).length + ' de ' + ORDEN_ACT.length + ' completadas';
}

function alternarAct(abierto){
  panelAct.classList.toggle('abierto', abierto);
  btnAct.setAttribute('aria-expanded', abierto);
  if (abierto) panelAct.querySelector('.act-item')?.focus({ preventScroll: true });
  else if (panelAct.contains(document.activeElement)) btnAct.focus();
}

function abrirAct(i){
  act = ORDEN_ACT[i]; actI = i;
  $('act-titulo').textContent = 'usuario@linux: ~ — Actividad: ' + act.titulo;
  alternarAct(false);
  if (!geo) geo = geometriaInicial();   // la primera vez se centra; después conserva donde la dejó la persona
  clearTimeout(cierreAct);              // por si se reabre mientras todavía se está desvaneciendo
  fondoAct.hidden = false;
  colocar();
  void fondoAct.offsetWidth;            // fuerza el primer dibujado para que el fundido de entrada se anime
  fondoAct.classList.add('visible');
  reiniciarAct();
}
let cierreAct = 0;
function cerrarAct(){
  fondoAct.classList.remove('visible'); // el velo y la ventana se desvanecen y, al terminar, se oculta el contenedor
  cierreAct = setTimeout(() => { fondoAct.hidden = true; }, reducido ? 0 : 300);
  btnAct.focus();
}

/* ---- Mover y redimensionar la ventana (como una ventana de GNOME) ----
   Mover: arrastrar la barra de título (o flechas con la barra enfocada).
   Redimensionar: arrastrar bordes y esquinas (o Mayús + flechas). Doble clic en la barra o botón □: maximizar. */
const ventAct = $('act-ventana'), barraAct = $('act-barra');
const TOPE = 30, MIN_W = 420, MIN_H = 320;   // TOPE = alto de la barra superior; mínimos de tamaño
let geo = null, maxim = false, gesto = null;

const minimos = () => ({ w: Math.min(MIN_W, innerWidth - 12), h: Math.min(MIN_H, innerHeight - TOPE) });
function geometriaInicial(){
  const w = Math.min(900, innerWidth - 12), h = Math.min(680, innerHeight - TOPE - 12);
  return { x: Math.round((innerWidth - w) / 2), y: TOPE + Math.max(6, Math.round((innerHeight - TOPE - h) / 2)), w, h };
}
function limitar(){   // la ventana nunca queda fuera de la pantalla ni más pequeña que el mínimo
  const m = minimos();
  geo.w = Math.max(m.w, Math.min(geo.w, innerWidth));
  geo.h = Math.max(m.h, Math.min(geo.h, innerHeight - TOPE));
  geo.x = Math.max(80 - geo.w, Math.min(geo.x, innerWidth - 80));  // siempre quedan 80 px visibles para poder agarrarla
  geo.y = Math.max(TOPE, Math.min(geo.y, innerHeight - 42));       // la barra de título nunca baja del borde inferior
}
function colocar(){
  if (!maxim) limitar();
  const r = maxim ? { x: 0, y: TOPE, w: innerWidth, h: innerHeight - TOPE } : geo;
  Object.assign(ventAct.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
  ventAct.classList.toggle('maximizada', maxim);
  $('act-max').textContent = maxim ? '❐' : '□';
  $('act-max').setAttribute('aria-label', maxim ? 'Restaurar ventana' : 'Maximizar ventana');
}
const alternarMax = () => { maxim = !maxim; colocar(); };

// Tiradores de los ocho bordes/esquinas
['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'].forEach(d => {
  const h = document.createElement('span'); h.className = 'res ' + d; h.dataset.d = d; ventAct.append(h);
});

ventAct.addEventListener('pointerdown', e => {
  if (e.button !== 0 || maxim) return;
  const tirador = e.target.closest('.res');
  const enBarra = barraAct.contains(e.target) && !e.target.closest('button');
  if (!tirador && !enBarra) return;
  gesto = { tipo: tirador ? tirador.dataset.d : 'mover', px: e.clientX, py: e.clientY, o: { ...geo } };
  (tirador || barraAct).setPointerCapture(e.pointerId);
});
ventAct.addEventListener('pointermove', e => {
  if (!gesto) return;
  const dx = e.clientX - gesto.px, dy = e.clientY - gesto.py, o = gesto.o, t = gesto.tipo, m = minimos();
  if (t === 'mover'){ geo.x = o.x + dx; geo.y = o.y + dy; }
  else {
    if (t.includes('e')) geo.w = Math.max(m.w, Math.min(o.w + dx, innerWidth - o.x));
    if (t.includes('s')) geo.h = Math.max(m.h, Math.min(o.h + dy, innerHeight - o.y));
    if (t.includes('w')){ const x = Math.max(0, Math.min(o.x + dx, o.x + o.w - m.w)); geo.w = o.x + o.w - x; geo.x = x; }
    if (t.includes('n')){ const y = Math.max(TOPE, Math.min(o.y + dy, o.y + o.h - m.h)); geo.h = o.y + o.h - y; geo.y = y; }
  }
  colocar();
});
['pointerup', 'pointercancel'].forEach(ev => ventAct.addEventListener(ev, () => { gesto = null; }));
barraAct.addEventListener('dblclick', e => { if (!e.target.closest('button')) alternarMax(); });
$('act-max').onclick = alternarMax;

// Teclado: con la barra de título enfocada, flechas = mover y Mayús + flechas = redimensionar
barraAct.addEventListener('keydown', e => {
  if (e.target !== barraAct || maxim) return;
  const d = 24, v = { ArrowLeft: [-d, 0], ArrowRight: [d, 0], ArrowUp: [0, -d], ArrowDown: [0, d] }[e.key];
  if (!v) return;
  e.preventDefault();
  if (e.shiftKey){ geo.w += v[0]; geo.h += v[1]; } else { geo.x += v[0]; geo.y += v[1]; }
  colocar();
});
addEventListener('resize', () => { if (!fondoAct.hidden) colocar(); });
function reiniciarAct(){
  pasoAct = 0; rutaAct = '~'; fallosAct = 0; hechaAct = false; mem = []; memI = 0;
  histAct = '<span class="c"># Escribe los comandos que pide el enunciado y pulsa Enter.</span>\n';
  entradaAct.value = '';
  pintarAct(); entradaAct.focus();
}

// Dibuja enunciado (con sus casillas) y terminal según el estado actual
function pintarAct(){
  const total = act.pasos.length;
  $('act-enunciado').innerHTML = '<h3>' + escapar(act.titulo) + '</h3>' + act.enunciado +
    '<ol class="tareas">' + act.pasos.map((p, i) =>
      '<li class="' + (i < pasoAct ? 'hecha' : (i === pasoAct && !hechaAct ? 'actual' : '')) + '">' + p.tarea + '</li>').join('') + '</ol>' +
    (hechaAct ? '<p class="exito">✔ ¡Actividad completada! ' + (act.final || '') + '</p>' : '');
  histoAct.innerHTML = histAct;
  $('act-linea').hidden = hechaAct;
  $('act-prompt').innerHTML = prompt(rutaAct);
  $('act-contador').textContent = hechaAct ? 'Completada · ' + total + ' / ' + total : 'Paso ' + (pasoAct + 1) + ' / ' + total;
  $('act-pista').textContent = hechaAct ? (actI < ORDEN_ACT.length - 1 ? 'Siguiente ▶' : 'Cerrar ✕') : '💡 Pista';
  pantAct.scrollTop = pantAct.scrollHeight;
}

const pistaHtml = paso => '<span class="c"># Pista: ' + escapar(paso.pista || 'repasa el enunciado y prueba con el comando que se pide.') + '</span>\n';
const aceptado = (paso, t) => paso.ok.some(o => o instanceof RegExp ? o.test(t) : o === t);

// Enter: valida el comando escrito contra el paso actual
function enviarAct(){
  if (hechaAct) return;
  const crudo = entradaAct.value, t = normalizar(crudo), paso = act.pasos[pasoAct];
  entradaAct.value = '';
  histAct += prompt(rutaAct) + escapar(crudo) + '\n';
  if (t){ mem.push(crudo.trim()); memI = mem.length; }
  if (!t){ /* línea vacía: solo avanza el prompt */ }
  else if (t === 'clear'){ histAct = ''; }
  else if (aceptado(paso, t)){
    if (paso.out) histAct += paso.out + '\n';
    if (paso.ruta) rutaAct = paso.ruta;
    pasoAct++; fallosAct = 0;
    if (pasoAct === act.pasos.length){
      hechaAct = true;
      histAct += '\n<span class="x">✔ Actividad completada</span>\n';
      if (!hechas.includes(act.id)){ hechas.push(act.id); guardarHechas(); construirLista(); }
    }
  } else {
    fallosAct++;
    const primera = t.split(' ')[0];
    const parecido = paso.ok.some(o => typeof o === 'string' && o.split(' ')[0] === primera);
    histAct += parecido
      ? '<span class="c"># Ese comando no es lo que pide el paso actual: revisa el enunciado.</span>\n'
      : 'bash: ' + escapar(primera) + ': orden no encontrada\n';
    if (fallosAct >= 2){ histAct += pistaHtml(paso); fallosAct = 0; }
  }
  pintarAct();
}

// Eventos de la terminal de la actividad
entradaAct.onkeydown = e => {
  if (e.key === 'Enter'){ e.preventDefault(); enviarAct(); }
  else if (e.key === 'ArrowUp'){ if (mem.length){ e.preventDefault(); memI = Math.max(0, memI - 1); entradaAct.value = mem[memI]; } }
  else if (e.key === 'ArrowDown'){ e.preventDefault(); memI = Math.min(mem.length, memI + 1); entradaAct.value = mem[memI] ?? ''; }
};
pantAct.onclick = () => { if (!getSelection().toString()) entradaAct.focus(); };
$('act-reiniciar').onclick = reiniciarAct;
$('act-pista').onclick = () => {
  if (hechaAct){ if (actI < ORDEN_ACT.length - 1) abrirAct(actI + 1); else cerrarAct(); return; }
  histAct += pistaHtml(act.pasos[pasoAct]); pintarAct(); entradaAct.focus();
};
$('act-cerrar').onclick = cerrarAct;

// Botón de la barra, borrar progreso, clic fuera y Escape
btnAct.onclick = () => alternarAct(!panelAct.classList.contains('abierto'));
$('act-borrar').onclick = () => { hechas = []; guardarHechas(); construirLista(); };
addEventListener('click', e => {
  if (panelAct.classList.contains('abierto') && !panelAct.contains(e.target) && !btnAct.contains(e.target)) alternarAct(false);
});
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!fondoAct.hidden && ventAct.contains(document.activeElement)) cerrarAct(); else alternarAct(false);
});

construirLista();

aplicar();
abrir(0, 0); // comando que se abre al cargar
</script>
