    destino = tokens[idx + 1];
    tokens = tokens.slice(0, idx).concat(tokens.slice(idx + 2));
    if (!destino) return { out:'', err:'bash: falta el fichero de redirección', code:1 };
  }
  const segmentos = [];
  let seg = [];
  for (const t of tokens){ if (t === '|'){ segmentos.push(seg); seg = []; } else seg.push(t); }

  let out = '', err = '', code = 0, entrada = stdin;
  for (const s of segmentos){
    if (!s.length) continue;
    const r = ejecutarSimple(e, s, entrada);
    out = r.out; err += r.err; code = r.code;
    if (code !== 0) break;

  }

    if (!esDir(e, padre)) return { out:'', err:'bash: ' + destino + ': No such file or directory', code:1 };
    const texto = redir === '2>' ? quitarHtml(err) : quitarHtml(out);
    const anterior = e.fs[p] && e.fs[p].tipo === 'file' ? e.fs[p].contenido : '';
    e.fs[p] = { tipo:'file', contenido: (redir === '>>' ? anterior : '') + texto + (texto && !texto.endsWith('\n') ? '\n' : ''), modo:'644' };

function ejecutarLinea(e, linea){

  while (i < tokens.length){
    const seg = [];
    while (i < tokens.length && ![';','&&','||'].includes(tokens[i])) seg.push(tokens[i++]);
    const op = tokens[i++];
    if (ejecutar && seg.length){

    else if (op === '||') ejecutar = code !== 0;
    else ejecutar = true;
  }
  return { out, err, code };
}

/* ---- Objetivos de un paso ---- */
function comprobarMeta(e, meta, salida){
  const texto = quitarHtml(salida || '');
  const falla = motivo => ({ ok:false, motivo, diagnostico: motivo });
  if (meta.cwd != null){
    const p = rutaAbs(meta.cwd, e.cwd);
    if (e.cwd !== p) return falla('Estás en ' + rutaVisible(e.cwd) + ', pero el objetivo es ' + rutaVisible(p) + '.');
  }
  for (const raw of [].concat(meta.existe || [])){
    const p = rutaAbs(raw, e.cwd);
    if (!e.fs[p]) return falla('Todavía no existe ' + rutaVisible(p) + '.');
  }
  for (const raw of [].concat(meta.noExiste || [])){
    const p = rutaAbs(raw, e.cwd);
    if (e.fs[p]) return falla('Sigue existiendo ' + rutaVisible(p) + '.');
  }
  if (meta.contenido){
    for (const [raw, esperado] of Object.entries(meta.contenido)){
      const p = rutaAbs(raw, e.cwd), it = e.fs[p];
      if (!it || it.tipo !== 'file') return falla('No existe el fichero ' + rutaVisible(p) + '.');
      if ((it.contenido || '') !== esperado) return falla('El contenido de ' + rutaVisible(p) + ' no es el esperado.');
    }
  }
  if (meta.modo){
    for (const [raw, esperado] of Object.entries(meta.modo)){
      const p = rutaAbs(raw, e.cwd), it = e.fs[p];
      if (!it) return falla('No existe ' + rutaVisible(p) + '.');
      if (modoDe(it) !== String(esperado).slice(-3)) return falla('Los permisos de ' + rutaVisible(p) + ' no son los esperados.');
    }
  }
  for (const en of [].concat(meta.enlace || [])){
    if (!en) continue;
    const p = rutaAbs(en.path, e.cwd), destino = rutaAbs(en.destino, e.cwd), it = e.fs[p];
    if (!it || it.tipo !== 'link') return falla('No existe el enlace ' + rutaVisible(p) + '.');
    if (it.destino !== destino) return falla('El enlace ' + rutaVisible(p) + ' no apunta a ' + rutaVisible(destino) + '.');
  }
  if (meta.funcion && !e.funciones.includes(meta.funcion)) return falla('La función ' + meta.funcion + ' no está cargada.');
  if (meta.umask != null){
    const esperada = String(meta.umask).replace(/^0+/, '').padStart(3, '0');
    if ((e.umask || '022') !== esperada) return falla('La umask es ' + (e.umask || '022') + ', pero debería ser ' + esperada + '.');
  }
  for (const x of [].concat(meta.muestra || [])){
    const coincide = x instanceof RegExp ? (x.lastIndex = 0, x.test(texto)) : texto.includes(x);
    if (!coincide) return falla('La salida no contiene ' + (x instanceof RegExp ? String(x) : x) + '.');
  }
  for (const x of [].concat(meta.noMuestra || [])){
    const coincide = x instanceof RegExp ? (x.lastIndex = 0, x.test(texto)) : texto.includes(x);
    if (coincide) return falla('La salida no debería contener ' + (x instanceof RegExp ? String(x) : x) + '.');
  }
  if (meta.orden){
    let pos = -1;
    for (const x of [].concat(meta.orden)){
      const i = texto.indexOf(x, pos + 1);
      if (i < 0) return falla('La salida no está en el orden pedido: falta ' + x + '.');
      pos = i;
    }
  }
  if (meta.salida != null && texto.trim() !== String(meta.salida).trim()) return falla('La salida no es la esperada.');
  return { ok:true, motivo:'' };
}

// API común para la actividad y el duelo. Devuelve el estado nuevo solo si el comando cumple el paso.
function validarPaso(paso, estado, t){
  if (typeof paso.ok === 'function'){
    const ok = paso.ok(t);
    return { ok, estado, salida:'', error: ok ? '' : 'Ese comando no es el que pide el paso.', diagnostico: ok ? '' : 'Revisa el comando y el objetivo de este paso.' };
  }
  // Formato antiguo (ok / acepta): se acepta el comando tal cual, sin ejecutarlo ni tocar el mundo.
  if (!paso.meta){
    if (!aceptado(paso, t)) return { ok:false, estado, salida:'', error:'Ese comando no es el que pide el paso.', diagnostico:'Ese comando no coincide con el objetivo del paso.' };
    return { ok:true, estado, salida: paso.out || '', error:'', diagnostico:'' };
  }
  const aprendizaje = comprobarAprendizaje(paso, t);
  if (!aprendizaje.ok) return { ok:false, estado, salida:'', error: aprendizaje.mensaje, diagnostico: aprendizaje.mensaje };
  const candidato = estado ? clonarEstado(estado) : null;
  const r = candidato ? ejecutarLinea(candidato, t) : { out:'', err:'', code:0 };
  if (r.code !== 0){
    const diagnostico = enriquecerDiagnostico(paso, r.err || 'El comando no se pudo ejecutar.');
    return { ok:false, estado, salida:'', error: diagnostico, diagnostico };
  }
  const v = comprobarMeta(candidato, paso.meta, r.out);
  return v.ok
    ? { ok:true, estado: candidato, salida: r.out || '', error:'', diagnostico:'' }
    : { ok:false, estado, salida:'', error: v.motivo, diagnostico: enriquecerDiagnostico(paso, v.diagnostico || v.motivo) };
}

function comprobarAprendizaje(paso, t){
  const req = paso.aprendizaje;
  const ejemploTokens = tokenizar(paso.ejemplo || '');

  }
  if (!req) return { ok:true, mensaje:'' };
  const tokens = tokenizar(t);
  if (req.comando && tokens[0] !== req.comando)
    return { ok:false, mensaje:'Este paso practica el comando ' + req.comando + '; revisa qué comando estás usando.' };
  const opciones = [].concat(req.opciones || []);
  const faltaOpcion = opciones.find(op => !tokens.includes(op));
  if (faltaOpcion)
    return { ok:false, mensaje:'El objetivo necesita el filtro ' + faltaOpcion + '; revisa cómo se aplica en este comando.' };
  const valores = [].concat(req.valores || []);
  const faltaValor = valores.find(valor => !tokens.includes(String(valor)));
  if (faltaValor)
    return { ok:false, mensaje:'El filtro está incompleto: falta indicar el tipo o valor que pide el ejercicio.' };
  return { ok:true, mensaje:'' };
}

function enriquecerDiagnostico(paso, mensaje){
  let texto = String(mensaje || '');
  const objetivo = paso.meta && (paso.meta.modo || paso.meta.existe || paso.meta.noExiste || paso.meta.contenido);
  const ruta = objetivo && typeof objetivo === 'object' && !Array.isArray(objetivo) ? Object.keys(objetivo)[0] : [].concat(objetivo || [])[0];
  if (/No such file or directory/i.test(texto) && ruta) texto += ' Revisa la ruta del objetivo: ' + ruta + '.';
  if (/permisos/i.test(texto) && tokenizar(paso.ejemplo || '')[0] === 'chmod' && tokenizar(paso.ejemplo || '').some(token => /^[ugoa]*[+-=][rwx]+$/.test(token)))
    texto += ' Este paso pide notación simbólica de chmod.';
  return texto;
}

function pistasSeguras(paso){
  const base = paso.aprendizaje && paso.aprendizaje.pistas ? paso.aprendizaje.pistas : paso.pista;
  const normal = texto => String(texto || '').replace(/<[^>]*>/g, '').trim().replace(/\s+/g, ' ');
  const ejemplo = normal(paso.ejemplo);
  const l = [].concat(base || []).filter(Boolean).filter(p => !ejemplo || !normal(p).includes(ejemplo));
  const comando = tokenizar(paso.ejemplo || '')[0] || 'comando';
  const simbolica = tokenizar(paso.ejemplo || '').some(token => /^[ugoa]*[+-=][rwx]+$/.test(token));
  if (simbolica && !l.some(p => /simbólica/i.test(p))) l.push('Este ejercicio pide notación simbólica: usa letras con +, - o =.');
  if (l.length < 3) l.push('Revisa el comando ' + comando + ' y el objetivo concreto del paso.');
  if (l.length < 3) l.push('Piensa en la forma general: ' + comando + ' [opciones] [argumentos].');
  return l.slice(0, 3);
}

// 1) Lectura y validación de las actividades que cargó actividades.js.
//    Lo que falle se avisa en la consola (F12) y la actividad se ignora, para que una errata no rompa todo el panel.
if (!window.ACTIVIDADES) console.error('Actividades: no se encontró actividades.js. Debe estar en la misma carpeta que este HTML y cargarse antes de este script.');
const idsVistos = new Set();
const DATOS_ACT = (window.ACTIVIDADES || []).filter((a, i) => {
  const nombre = '«' + ((a && (a.titulo || a.id)) || 'actividad nº ' + (i + 1)) + '»';
  if (!a || !a.id){ console.warn('Actividades: ' + nombre + ' no tiene "id" y se ignora.'); return false; }
  if (idsVistos.has(a.id)){ console.warn('Actividades: el id "' + a.id + '" está repetido (' + nombre + ') y se ignora. Cada actividad necesita un id único.'); return false; }
  if (!Array.isArray(a.pasos) || !a.pasos.length){ console.warn('Actividades: ' + nombre + ' no tiene "pasos" y se ignora.'); return false; }
  const mal = a.pasos.findIndex(p => !p || (!p.meta && !p.ok && !p.acepta));
  if (mal >= 0){ console.warn('Actividades: en ' + nombre + ' el paso ' + (mal + 1) + ' no tiene "meta", "ok" ni "acepta" y la actividad se ignora.'); return false; }
  const sinEjemplo = a.pasos.findIndex(p => p && !p.ejemplo);
  if (sinEjemplo >= 0) console.warn('Actividades: en ' + nombre + ' el paso ' + (sinEjemplo + 1) + ' no tiene "ejemplo"; la solución y el progreso guardado funcionarán peor.');
  idsVistos.add(a.id);   // solo cuenta si la actividad es válida
  return true;
});

// 2) Subapartados: se agrupan por el campo "grupo" (en orden de aparición); ORDEN_ACT es la lista plana en ese mismo orden
const GRUPOS_ACT = [];
DATOS_ACT.forEach(a => {
  const nombre = a.grupo || 'General';
  let gr = GRUPOS_ACT.find(x => x.titulo === nombre);
  if (!gr) GRUPOS_ACT.push(gr = { titulo: nombre, items: [] });
  gr.items.push(a);
});
const ORDEN_ACT = GRUPOS_ACT.flatMap(gr => gr.items);
const INDICE_ACT = new Map(ORDEN_ACT.map((a, i) => [a, i]));   // id/objeto → posición, para no recorrer la lista en cada elemento
const escapar = t => Object.assign(document.createElement('div'), { textContent: t }).innerHTML;
const normalizar = t => t.trim().replace(/\s+/g, ' ');

// Actividades completadas y progreso paso a paso (se recuerdan si el navegador lo permite)
let hechas = [];
try {
  const guardado = JSON.parse(localStorage.getItem('actividades-hechas'));
  if (Array.isArray(guardado)) hechas = guardado.filter(x => typeof x === 'string');
} catch (e) { hechas = []; }
const guardarHechas = () => { try { localStorage.setItem('actividades-hechas', JSON.stringify(hechas)); } catch (e) {} };

// progreso[id] = { paso, estado } → permite retomar una actividad donde se dejó
let progreso = {};
try {
  const g = JSON.parse(localStorage.getItem('actividades-progreso'));
  if (g && typeof g === 'object' && !Array.isArray(g)) progreso = g;
} catch (e) { progreso = {}; }
const guardarProgreso = () => { try { localStorage.setItem('actividades-progreso', JSON.stringify(progreso)); } catch (e) {} };

// Puntos y sonido: refuerzo al superar pasos. "Borrar progreso" también pone los puntos a cero.
let puntos = 0;
try { const g = Number(localStorage.getItem('actividades-puntos')); if (Number.isFinite(g) && g > 0) puntos = Math.floor(g); } catch (e) {}
const guardarPuntos = () => { try { localStorage.setItem('actividades-puntos', String(puntos)); } catch (e) {} };
let sonido = true;
try { if (localStorage.getItem('actividades-sonido') === '0') sonido = false; } catch (e) {}

// ESTADO de la actividad abierta (pintarAct() dibuja la pantalla a partir de estas variables)
let act = null,          // actividad abierta (objeto de ORDEN_ACT)
    actI = 0,            // su posición en ORDEN_ACT
    estadoAct = null,    // mundo virtual: { cwd, fs, funciones }
    rutaAct = null,      // (formato antiguo) ruta que muestra el prompt si el paso trae "ruta"
    pasoAct = 0,         // paso que toca resolver (0 = el primero)
    histAct = '',        // HTML de lo ya escrito en la terminal (comandos y salidas)
    fallosAct = 0,       // fallos seguidos en el paso actual (2 → pista, 3 → Ver solución)
    fallosPaso = 0,      // total de intentos fallidos en el paso actual (se muestra en la lista)
    pistaIdx = 0,        // pistas del paso actual ya enseñadas (cada petición muestra la siguiente)
    ayudaAct = false,    // true si en este paso se pidió "Ver solución" (da menos puntos)
    hechaAct = false,    // true cuando se ha superado el último paso
    mem = [], memI = 0;  // historial de comandos escritos (flechas ↑ ↓) y posición en él

// ---- Panel lateral: subapartados desplegables con buscador ----
const estadoGrupos = new Map();   // título del subapartado → ¿desplegado? (se recuerda aunque la lista se vuelva a dibujar)
const sinTildes = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();  // buscar sin distinguir tildes ni mayúsculas

// Dibuja el panel. Se llama al cargar, al completar una actividad, al borrar el progreso y al escribir en el buscador.
const NIVELES = { 1: 'Básico', 2: 'Medio', 3: 'Reto' };
const nivelDe = a => NIVELES[a.nivel] ? a.nivel : 1;
const textoBuscable = a => sinTildes([a.grupo || '', a.titulo, a.resumen || ''].concat(a.pasos.map(p => p.tarea || '')).join(' ').replace(/<[^>]*>/g, ' '));
function construirLista(){
  const lista = $('act-lista'), q = sinTildes($('act-buscar').value.trim()), nivel = $('act-nivel').value;
  const aviso = texto => { lista.innerHTML = '<p class="act-vacio"></p>'; lista.firstChild.textContent = texto; };
  lista.innerHTML = '';
  if (!ORDEN_ACT.length) aviso('No hay actividades cargadas. Comprueba que actividades.js está en la misma carpeta que este HTML.');
  let coincidencias = 0;
  GRUPOS_ACT.forEach(gr => {
    // Se filtra por nivel y por texto (título, resumen y tareas de los pasos). El texto buscado incluye
    // el nombre del subapartado, así que buscar el nombre de un subapartado muestra todas sus actividades.
    const items = gr.items.filter(a => (!nivel || String(nivelDe(a)) === nivel) && (!q || textoBuscable(a).includes(q)));
    if (!items.length) return;
    coincidencias += items.length;
    const det = document.createElement('details');
    // Buscando: todo desplegado. Sin buscar: lo que dejó la persona o, la primera vez, el valor por defecto.
    det.open = q ? true : (estadoGrupos.has(gr.titulo) ? estadoGrupos.get(gr.titulo) : !PLEGAR_GRUPOS_AL_INICIO);
    det.innerHTML = '<summary></summary><div class="items"></div>';
    const resumen = det.firstChild, caja = det.lastChild;
    resumen.textContent = gr.titulo + ' · ' + gr.items.filter(a => hechas.includes(a.id)).length + '/' + gr.items.length;  // hechas/total
    resumen.onclick = e => {
      e.preventDefault();
      const abriendo = !det.open;
      alternarGrupo(det, caja);                        // mismo plegado con desvanecimiento que el panel principal
      if (!q) estadoGrupos.set(gr.titulo, abriendo);   // mientras se busca no se guarda: ese desplegado es temporal
    };
    items.forEach(a => {
      const i = INDICE_ACT.get(a), ok = hechas.includes(a.id), b = document.createElement('button');
      b.type = 'button'; b.className = 'act-item' + (ok ? ' hecha' : '');
      b.innerHTML = '<span class="act-num"></span><span class="act-txt"><b></b><small></small></span>';
      b.children[0].textContent = ok ? '✓' : i + 1;     // número global (posición en ORDEN_ACT) o ✓ si está completada
      b.children[1].children[0].textContent = a.titulo;
      b.children[1].children[1].textContent = a.resumen + ' · ' + NIVELES[nivelDe(a)] + ' · ' + a.pasos.length + (a.pasos.length === 1 ? ' paso' : ' pasos') + (ok ? ' · completada' : '');
      b.onclick = () => abrirAct(i);
      caja.append(b);
    });
    lista.append(det);
  });
  if (ORDEN_ACT.length && !coincidencias) aviso('Ninguna actividad coincide con «' + $('act-buscar').value.trim() + '»' + (nivel ? ' en el nivel ' + NIVELES[nivel] : '') + '.');
  const enCurso = ORDEN_ACT.filter(a => !hechas.includes(a.id) && progreso[a.id] && progreso[a.id].paso > 0).length;
  $('act-progreso').textContent = ORDEN_ACT.filter(a => hechas.includes(a.id)).length + ' de ' + ORDEN_ACT.length + ' completadas' +
    (enCurso ? ' · ' + enCurso + ' en curso' : '') + (puntos ? ' · ⭐ ' + puntos + ' pts' : '');
}
$('act-buscar').oninput = construirLista;
$('act-nivel').onchange = construirLista;

// Abre/cierra el panel lateral. Al abrir el foco va al buscador (con los grupos plegados no hay botones a los que llevarlo).
function alternarAct(abierto){
  panelAct.classList.toggle('abierto', abierto);
  btnAct.setAttribute('aria-expanded', abierto);
  if (abierto) $('act-buscar').focus({ preventScroll: true });
  else if (panelAct.contains(document.activeElement)) btnAct.focus();
}

// Mientras el diálogo está abierto, el resto de la página no recibe clics ni foco
// (los avisos y los anuncios se quedan fuera: inert los ocultaría a los lectores de pantalla)
const capaFondo = [...document.body.children].filter(el =>
  el.id !== 'act-fondo' && el.id !== 'anuncio' && el.id !== 'aviso' && el.tagName !== 'SCRIPT' && el.tagName !== 'NOSCRIPT');
function bloquearFondo(si){ capaFondo.forEach(el => { el.inert = si; }); }

// Abre la actividad nº i de ORDEN_ACT: pone el título, cierra el panel, coloca la ventana y la muestra con fundido.
// Si ya había una abierta (botón "Siguiente ▶") se limita a cambiar el contenido: el velo no se repite.
function abrirAct(i){
  act = ORDEN_ACT[i]; actI = i;
  $('act-titulo').textContent = 'usuario@linux: ~ — Actividad: ' + act.titulo + ' · Nivel ' + nivelDe(act) + ' (' + NIVELES[nivelDe(act)] + ')';
  alternarAct(false);
  if (!geo) geo = geometriaInicial();   // la primera vez se centra; después conserva donde la dejó la persona
  clearTimeout(cierreAct);              // por si se reabre mientras todavía se está desvaneciendo
  fondoAct.hidden = false;
  bloquearFondo(true);
  colocar();
  void fondoAct.offsetWidth;            // fuerza el primer dibujado para que el fundido de entrada se anime
  fondoAct.classList.add('visible');
  cargarAct();
}
let cierreAct = 0;
// Cierra la ventana: quita la clase "visible" (el CSS hace el fundido) y oculta el contenedor al terminar la transición.
function cerrarAct(){
  fondoAct.classList.remove('visible'); // el velo y la ventana se desvanecen y, al terminar, se oculta el contenedor
  bloquearFondo(false);
  setTimeout(() => { $('act-fx').innerHTML = ''; }, 400);   // sin partículas sueltas al reabrir
  cierreAct = setTimeout(() => { fondoAct.hidden = true; }, reducido ? 0 : 300);
  btnAct.focus();
}

/* ---- Mover y redimensionar la ventana (como una ventana de GNOME) ----
   Mover: arrastrar la barra de título (o flechas con la barra enfocada).
   Redimensionar: arrastrar bordes y esquinas (o Mayús + flechas). Doble clic en la barra o botón □: maximizar. */
const ventAct = $('act-ventana'), barraAct = $('act-barra');
const TOPE = 30, MIN_W = 420, MIN_H = 320;   // TOPE = alto de la barra superior; mínimos de tamaño
let geo = null, maxim = false, gesto = null;

const minimos = () => ({ w: Math.min(MIN_W, innerWidth - 12), h: Math.min(MIN_H, innerHeight - TOPE) });
function geometriaInicial(){
  const w = Math.min(900, innerWidth - 12), h = Math.min(680, innerHeight - TOPE - 12);
  return { x: Math.round((innerWidth - w) / 2), y: TOPE + Math.max(6, Math.round((innerHeight - TOPE - h) / 2)), w, h };
}
function limitar(){   // la ventana nunca queda fuera de la pantalla ni más pequeña que el mínimo
  const m = minimos();
  geo.w = Math.max(m.w, Math.min(geo.w, innerWidth));
  geo.h = Math.max(m.h, Math.min(geo.h, innerHeight - TOPE));
  geo.x = Math.max(80 - geo.w, Math.min(geo.x, innerWidth - 80));  // siempre quedan 80 px visibles para poder agarrarla
  geo.y = Math.max(TOPE, Math.min(geo.y, innerHeight - 42));       // la barra de título nunca baja del borde inferior
}
function colocar(){
  if (!maxim) limitar();
  const r = maxim ? { x: 0, y: TOPE, w: innerWidth, h: innerHeight - TOPE } : geo;
  Object.assign(ventAct.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
  ventAct.classList.toggle('maximizada', maxim);
  $('act-max').textContent = maxim ? '❐' : '□';
  $('act-max').setAttribute('aria-label', maxim ? 'Restaurar ventana' : 'Maximizar ventana');
}
const alternarMax = () => { maxim = !maxim; colocar(); };

// Tiradores de los ocho bordes/esquinas
['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'].forEach(d => {
  const h = document.createElement('span'); h.className = 'res ' + d; h.dataset.d = d; ventAct.append(h);
});

ventAct.addEventListener('pointerdown', e => {
  if (e.button !== 0 || maxim) return;
  const tirador = e.target.closest('.res');
  const enBarra = barraAct.contains(e.target) && !e.target.closest('button');
  if (!tirador && !enBarra) return;
  gesto = { tipo: tirador ? tirador.dataset.d : 'mover', px: e.clientX, py: e.clientY, o: { ...geo } };
  (tirador || barraAct).setPointerCapture(e.pointerId);
});
ventAct.addEventListener('pointermove', e => {
  if (!gesto) return;
  const dx = e.clientX - gesto.px, dy = e.clientY - gesto.py, o = gesto.o, t = gesto.tipo, m = minimos();
  if (t === 'mover'){ geo.x = o.x + dx; geo.y = o.y + dy; }
  else {
    if (t.includes('e')) geo.w = Math.max(m.w, Math.min(o.w + dx, innerWidth - o.x));
    if (t.includes('s')) geo.h = Math.max(m.h, Math.min(o.h + dy, innerHeight - o.y));
    if (t.includes('w')){ const x = Math.max(0, Math.min(o.x + dx, o.x + o.w - m.w)); geo.w = o.x + o.w - x; geo.x = x; }
    if (t.includes('n')){ const y = Math.max(TOPE, Math.min(o.y + dy, o.y + o.h - m.h)); geo.h = o.y + o.h - y; geo.y = y; }
  }
  colocar();
});
['pointerup', 'pointercancel'].forEach(ev => ventAct.addEventListener(ev, () => { gesto = null; }));
barraAct.addEventListener('dblclick', e => { if (!e.target.closest('button')) alternarMax(); });
$('act-max').onclick = alternarMax;

// Foco atrapado dentro de la ventana mientras el diálogo está abierto
ventAct.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const foco = [...ventAct.querySelectorAll('button, input, select, textarea, a[href], [tabindex]:not([tabindex="-1"])')]
    .filter(el => !el.disabled && el.offsetParent !== null);
  if (!foco.length) return;
  const primero = foco[0], ultimo = foco[foco.length - 1];
  if (!ventAct.contains(document.activeElement)){ e.preventDefault(); primero.focus(); return; }
  if (e.shiftKey && document.activeElement === primero){ e.preventDefault(); ultimo.focus(); }
  else if (!e.shiftKey && document.activeElement === ultimo){ e.preventDefault(); primero.focus(); }
});

// Teclado: con la barra de título enfocada, flechas = mover y Mayús + flechas = redimensionar
barraAct.addEventListener('keydown', e => {
  if (e.target !== barraAct || maxim) return;
  const d = 24, v = { ArrowLeft: [-d, 0], ArrowRight: [d, 0], ArrowUp: [0, -d], ArrowDown: [0, d] }[e.key];
  if (!v) return;
  e.preventDefault();
  if (e.shiftKey){ geo.w += v[0]; geo.h += v[1]; } else { geo.x += v[0]; geo.y += v[1]; }
  colocar();
});
addEventListener('resize', () => { if (!fondoAct.hidden) colocar(); });
// ¿Se puede reutilizar el estado guardado de esta actividad?
const progresoValido = g => !!g && Number.isInteger(g.paso) && g.paso >= 0 && g.paso <= act.pasos.length &&
  !!g.estado && typeof g.estado.cwd === 'string' && !!g.estado.fs && Array.isArray(g.estado.funciones);

/* ---- Celebración: partículas, puntos y sonido ----
   Nada de imágenes ni librerías: se crean unos <i> con una animación CSS y se borran solos.
   Con "reducir movimiento" activado solo quedan los puntos y el sonido. */
let audioCtx = null;
function tono(frec, dur, tipo, vol, retraso){
  if (!sonido) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + (retraso || 0);
    const o = audioCtx.createOscillator(), v = audioCtx.createGain();
    o.type = tipo || 'sine';
    o.frequency.value = frec;
    v.gain.setValueAtTime(0.0001, t0);
    v.gain.exponentialRampToValueAtTime(vol || 0.04, t0 + 0.012);
    v.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(v); v.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}   // si el navegador bloquea el audio, la celebración sigue siendo visual
}
const sonidoPaso = () => { tono(784, .12, 'sine', .04); tono(1175, .16, 'sine', .028, .08); };
const sonidoFin = () => [523, 659, 784, 1047].forEach((f, i) => tono(f, .22, 'triangle', .038, i * .1));

// Punto desde el que salen las partículas: la línea de escritura (o el centro de la terminal si ya terminó)
function puntoAct(){
  const caja = $('act-fx'), ref = $('act-linea').hidden ? $('act-pantalla') : $('act-linea');
  const r = caja.getBoundingClientRect(), l = ref.getBoundingClientRect();
  return { x: Math.max(14, l.left - r.left + 18), y: Math.max(14, l.top - r.top + l.height / 2) };
}

function particulas(n, x, y, fuerza){
  if (reducido) return;
  const caja = $('act-fx'), colores = ['#e5a50a', '#26a269', '#3584e4', '#c061cb', '#f6d32d', '#ffffff'];
  for (let i = 0; i < n; i++){
    const p = document.createElement('i');
    const ang = Math.random() * Math.PI * 2;
    const dist = (fuerza ? 90 : 30) + Math.random() * (fuerza ? 220 : 75);
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = colores[i % colores.length];
    p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    p.style.setProperty('--dy', (Math.sin(ang) * dist * .8 - (fuerza ? 50 : 8)) + 'px');
    p.style.setProperty('--rot', Math.round(Math.random() * 900 - 450) + 'deg');
    p.style.setProperty('--dur', Math.round(600 + Math.random() * 550) + 'ms');
    if (i % 3 === 0){ p.style.width = '5px'; p.style.height = '11px'; p.style.borderRadius = '1px'; }
    caja.append(p);
    p.addEventListener('animationend', () => p.remove(), { once: true });
  }
}

function flotante(texto, x, y){
  if (reducido) return;
  const n = document.createElement('span');
  n.className = 'act-mas';
  n.textContent = texto;
  n.style.left = x + 'px';
  n.style.top = y + 'px';
  $('act-fx').append(n);
  n.addEventListener('animationend', () => n.remove(), { once: true });
}

// Suma puntos y celebra: pequeño estallido al superar un paso, confeti al terminar la actividad.
function sumarPuntos(n, fin){
  puntos += n; guardarPuntos();
  const p = puntoAct();
  flotante('+' + n + ' ⭐', p.x, p.y);
  particulas(fin ? 60 : 14, p.x, p.y, !!fin);
  if (fin) sonidoFin(); else sonidoPaso();
}

// Botón de sonido (se recuerda entre visitas)
const btnSonido = $('act-sonido');
function pintarSonido(){
  btnSonido.textContent = sonido ? '🔊' : '🔇';
  btnSonido.setAttribute('aria-pressed', String(sonido));
  btnSonido.title = sonido ? 'Sonido activado. Pulsa para desactivarlo.' : 'Sonido desactivado. Pulsa para activarlo.';
}
btnSonido.onclick = () => {
  sonido = !sonido;
  try { localStorage.setItem('actividades-sonido', sonido ? '1' : '0'); } catch (e) {}
  pintarSonido();
  if (sonido) sonidoPaso();
};
pintarSonido();

// Texto de bienvenida de la terminal de la actividad (se repite al retomar y al reiniciar)
const AYUDA_ACT = '<span class="c"># Escribe los comandos que pide el enunciado y pulsa Enter.</span>\n' +
  '<span class="c"># Tab completa · ↑ ↓ historial · Ctrl+L limpia · Ctrl+C cancela.</span>\n';

/* ---- Panel de estructura de carpetas y permisos (solo en la actividad) ---- */
const mapaAct = $('act-mapa'), mapaArbol = $('act-mapa-arbol'), mapaRuta = $('act-mapa-ruta'), btnMapa = $('act-mapa-min');
let mapaMin = false, mapaAncho = 300;
try {
  const w = Number(localStorage.getItem('act-mapa-ancho'));
  if (Number.isFinite(w) && w > 0) mapaAncho = Math.min(Math.max(Math.round(w), 160), 800);
  const pref = localStorage.getItem('act-mapa-min');
  mapaMin = pref === '1' || (pref === null && innerWidth < 720);   // en móvil empieza plegado
} catch (e) { mapaMin = innerWidth < 720; }
const guardarMapa = () => {
  try {
    localStorage.setItem('act-mapa-ancho', String(mapaAncho));
    localStorage.setItem('act-mapa-min', mapaMin ? '1' : '0');
  } catch (e) {}   // sin almacenamiento, el panel sigue funcionando durante la visita
};
function aplicarMapa(){
  mapaAct.classList.toggle('minimizada', mapaMin);
  mapaAct.style.setProperty('--mapa-w', mapaAncho + 'px');
  btnMapa.textContent = mapaMin ? '+' : '−';
  btnMapa.setAttribute('aria-expanded', String(!mapaMin));
  btnMapa.setAttribute('aria-label', mapaMin ? 'Mostrar panel de estructura' : 'Minimizar panel de estructura');
  btnMapa.title = mapaMin ? 'Mostrar estructura de carpetas' : 'Minimizar estructura de carpetas';
}
btnMapa.onclick = () => {
  mapaMin = !mapaMin;
  aplicarMapa();
  guardarMapa();
  if (!mapaMin) mapaArbol.scrollTop = 0;
};
function pintarMapaAct(){
  if (!estadoAct) return;
  const y = mapaArbol.scrollTop;   // conserva el desplazamiento al ejecutar comandos
  mapaArbol.innerHTML = mapaResumenHtml(estadoAct, hechaAct ? null : act.pasos[pasoAct]);
  mapaArbol.scrollTop = y;
  mapaRuta.textContent = rutaVisible(estadoAct.cwd);
}
const resMapa = $('act-mapa-res');
let arrastreMapa = null;
resMapa.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  e.preventDefault();
  arrastreMapa = { x: e.clientX, w: mapaAct.getBoundingClientRect().width };
  resMapa.setPointerCapture(e.pointerId);
});
resMapa.addEventListener('pointermove', e => {
  if (!arrastreMapa) return;
  const cuerpo = document.querySelector('#act-fondo .act-cuerpo');
  const max = Math.max(180, Math.round((cuerpo ? cuerpo.clientWidth : innerWidth) * .45));
  mapaAncho = Math.max(160, Math.min(Math.round(arrastreMapa.w + arrastreMapa.x - e.clientX), max));
  aplicarMapa();
});
['pointerup', 'pointercancel'].forEach(ev => resMapa.addEventListener(ev, () => {
  if (!arrastreMapa) return;
  arrastreMapa = null;
  guardarMapa();
}));
resMapa.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  const cuerpo = document.querySelector('#act-fondo .act-cuerpo');
  const max = Math.max(180, Math.round((cuerpo ? cuerpo.clientWidth : innerWidth) * .45));
  mapaAncho = Math.max(160, Math.min(mapaAncho + (e.key === 'ArrowLeft' ? 20 : -20), max));
  aplicarMapa();
  guardarMapa();
});
aplicarMapa();

// Abre la actividad retomando el paso guardado (si lo hay) y su mundo virtual.
function cargarAct(){
  pasoAct = 0; fallosAct = 0; fallosPaso = 0; pistaIdx = 0; ayudaAct = false; hechaAct = false; mem = []; memI = 0; rutaAct = null;
  estadoAct = crearEstado(act);
  const g = progreso[act.id];
  if (progresoValido(g) && g.paso > 0){
    pasoAct = g.paso;
    estadoAct = g.estado;
    if (typeof g.ruta === 'string') rutaAct = g.ruta;   // compatibilidad con el formato antiguo
    hechaAct = pasoAct >= act.pasos.length;
  }
  histAct = AYUDA_ACT;
  if (pasoAct && !hechaAct) histAct += '<span class="c"># Retomas la actividad en el paso ' + (pasoAct + 1) + ' de ' + act.pasos.length + '.</span>\n';
  entradaAct.value = '';
  mapaArbol.scrollTop = 0;
  pintarAct(); entradaAct.focus();
}

// Vuelve al paso 1 con la terminal limpia y borra el progreso guardado de esta actividad.
function reiniciarAct(){
  pasoAct = 0; fallosAct = 0; fallosPaso = 0; pistaIdx = 0; ayudaAct = false; hechaAct = false; mem = []; memI = 0; rutaAct = null;
  estadoAct = crearEstado(act);
  delete progreso[act.id]; guardarProgreso(); construirLista();
  histAct = AYUDA_ACT;
  entradaAct.value = '';
  pintarAct(); entradaAct.focus();
}

// Dibuja enunciado (con sus casillas) y terminal según el estado actual
// Redibuja enunciado (con sus casillas) y terminal a partir del ESTADO. Es lo único que toca el DOM de la actividad.
function pintarAct(){
  const total = act.pasos.length;
  // "enunciado", "explica" y "final" pueden ser un texto o una lista de textos
  $('act-enunciado').innerHTML = '<h3>' + escapar(act.titulo) + '</h3>' + unir(act.enunciado) +
    '<ol class="tareas">' + act.pasos.map((p, i) =>
      '<li class="' + (i < pasoAct ? 'hecha' : (i === pasoAct && !hechaAct ? 'actual' : '')) + '">' + p.tarea +
      (i === pasoAct && !hechaAct && fallosPaso > 0 ? ' <span class="fallos-paso" tabindex="0" role="img" aria-label="Intentos fallidos en este paso: ' + fallosPaso + '" title="Intentos fallidos en este paso: ' + fallosPaso + '">' + fallosPaso + '</span>' : '') +
      (i < pasoAct && p.explica ? '<div class="nota">' + unir(p.explica, true) + '</div>' : '') + '</li>').join('') + '</ol>' +
    (hechaAct ? '<p class="exito">✔ ¡Actividad completada! ' + unir(act.final) + '</p>' + solucionHtml(act) : '');
  histoAct.innerHTML = histAct;
  $('act-linea').hidden = hechaAct;
  $('act-prompt').innerHTML = promptHtml(rutaAct || rutaVisible(estadoAct.cwd));
  $('act-contador').textContent = (hechaAct ? 'Completada · ' + total + ' / ' + total : 'Paso ' + (pasoAct + 1) + ' / ' + total) + (puntos ? ' · ⭐ ' + puntos : '');
  $('anuncio').textContent = hechaAct ? 'Actividad completada: ' + act.titulo : 'Paso ' + (pasoAct + 1) + ' de ' + total + ': ' + act.titulo;
  $('act-pista').textContent = hechaAct ? (actI < ORDEN_ACT.length - 1 ? 'Siguiente ▶' : 'Cerrar ✕') : '💡 Pista';
  $('act-solucion').hidden = hechaAct || fallosPaso < 3 || ayudaAct;
  $('act-solucion').textContent = 'Ver una solución explicada';
  pantAct.scrollTop = pantAct.scrollHeight;
  pintarMapaAct();
  if (hechaAct){ const caja = document.querySelector('#act-enunciado .solucion'); if (caja) setTimeout(() => caja.scrollIntoView({ block:'nearest', behavior: reducido ? 'auto' : 'smooth' }), 250); }
}

// Recuadro blanco con la explicación de la solución. Usa el campo "solucion" de la actividad (texto o lista de párrafos);
// si no existe, se genera solo: un resumen con el comando de cada paso y su "explica".
function solucionHtml(a){
  let cuerpo;
  if (a.solucion) cuerpo = unir(a.solucion, true);
  else cuerpo = '<ol>' + a.pasos.map(p => {
    const cmd = p.ejemplo || (Array.isArray(p.ok) ? p.ok.find(o => typeof o === 'string') : '');
    return '<li>' + (cmd ? '<code>' + escapar(cmd) + '</code>' : '') + (p.explica ? ' — ' + [].concat(p.explica).join(' ') : '') + '</li>';
  }).join('') + '</ol>';
  return '<div class="solucion" role="region" aria-label="Explicación de la solución"><h4>Explicación de la solución</h4>' + cuerpo + '</div>';
}
const unir = (x, parrafos) => [].concat(x || '').map(t => parrafos ? '<p>' + t + '</p>' : t).join('');   // texto o lista de textos → HTML
// "pista" puede ser un texto o una LISTA con todas las pistas que quieras (de más suave a más directa).
// Cada petición (botón o 2 fallos seguidos) enseña la siguiente; al acabarse se repite la última.
const pistasDe = paso => {
  const l = pistasSeguras(paso);
  return l.length ? l : ['repasa el concepto del enunciado y prueba con la forma general del comando.'];
};
function pistaHtml(paso){
  const l = pistasDe(paso), n = Math.min(pistaIdx, l.length - 1), agotadas = pistaIdx >= l.length;
  if (agotadas) return '<span class="c"># Ya no hay más pistas para este paso; revisa el diagnóstico anterior.</span>\n';
  pistaIdx = Math.min(pistaIdx + 1, l.length);
  return '<span class="c"># Pista' + (l.length > 1 ? ' ' + (n + 1) + '/' + l.length : '') + ': ' + escapar(l[n]) + (agotadas && l.length > 1 ? ' (no hay más pistas)' : '') + '</span>\n';
}
// Pasos antiguos (ok / acepta) y pasos nuevos (meta): aceptado() solo mira las respuestas de texto o regex.
const patronesDe = paso => [].concat(paso.acepta || paso.ok || []).filter(o => typeof o === 'string' || o instanceof RegExp);
const aceptado = (paso, t) => patronesDe(paso).some(o => {
  if (!(o instanceof RegExp)) return normalizar(o) === t;
  o.lastIndex = 0;            // evita fallos si la expresión regular lleva el flag "g"
  return o.test(t);
});

// Enter: valida el comando escrito contra el paso actual
// Se ejecuta al pulsar Enter en la terminal de la actividad: validarPaso() prueba el comando sobre una copia
// del mundo virtual y solo guarda el estado nuevo si cumple el objetivo (meta) del paso.
function enviarAct(){
  if (hechaAct) return;
  const crudo = entradaAct.value, t = normalizar(crudo), paso = act.pasos[pasoAct];
  entradaAct.value = '';
  histAct += promptHtml(rutaAct || rutaVisible(estadoAct.cwd)) + escapar(crudo) + '\n';
  if (t){ mem.push(crudo.trim()); memI = mem.length; }
  if (!t){ /* línea vacía: solo avanza el prompt */ }
  else if (t === 'clear'){ histAct = ''; }
  else if (t === 'history'){
    histAct += mem.map((c, i) => String(i + 1).padStart(3, ' ') + '  ' + escapar(c)).join('\n') + '\n';
  }
  else {
    const v = validarPaso(paso, estadoAct, t);
    if (v.ok){
      estadoAct = v.estado;
      if (paso.ruta) rutaAct = paso.ruta;   // formato antiguo: la ruta del prompt viene del paso
      if (v.salida) histAct += v.salida + '\n';
      // Puntos: 15 si sale a la primera, 10 si hubo fallos, 5 si se pidió la solución. Terminar: +25.
      const gana = ayudaAct ? 5 : fallosAct === 0 ? 15 : 10;
      ayudaAct = false;
      pasoAct++; fallosAct = 0; fallosPaso = 0; pistaIdx = 0;
      if (pasoAct === act.pasos.length){
        hechaAct = true;
        sumarPuntos(25, true);
        histAct += '\n<span class="x">✔ Actividad completada · +25 ⭐</span>\n';
        delete progreso[act.id]; guardarProgreso();
        if (!hechas.includes(act.id)){ hechas.push(act.id); guardarHechas(); }
      } else {
        sumarPuntos(gana, false);
        progreso[act.id] = { paso: pasoAct, estado: estadoAct, ruta: rutaAct };   // retomar aquí la próxima vez
        guardarProgreso();
      }
      construirLista();
    } else {
      fallosAct++;
      fallosPaso++;
      histAct += '<span class="c"># ' + escapar(v.diagnostico || v.error || 'Ese comando no es el que pide el paso.') + '</span>\n';
      if (fallosAct === 2) histAct += pistaHtml(paso);
      else if (fallosAct === 3) histAct += '<span class="c"># Pide otra pista: te orientará sin darte el comando completo.</span>\n';
    }
  }
  // La terminal de la actividad no crece sin límite durante una sesión larga
  const lineas = histAct.split('\n');
  if (lineas.length > 240) histAct = lineas.slice(-240).join('\n');
  pintarAct();
}

/* ---- Tab: completa comandos, opciones y rutas, como bash ---- */
const OPCIONES_CMD = {
  ls:'-a -A -l -h -r -R -1 -t -i', cd:'-P', mkdir:'-p', rm:'-r -f', cp:'-r', ln:'-s', chmod:'-R',
  grep:'-i -r -n -v', find:'-name -type -user -group -exec -maxdepth', head:'-n', tail:'-n', sort:'-r -n -k',
  du:'-h -s', tree:'-L -a', wc:'-l -w -c', type:'-a -t'
};
const COMANDOS_TAB = () => ['clear', 'history', 'mkcd'].concat(Object.keys(CMD_SIM).filter(x => x !== '.')).sort((a, b) => a.localeCompare(b, 'es'));

// Candidatos para el trozo que va del último espacio al cursor.
function candidatosTab(texto, pos, estado){
  const desde = texto.lastIndexOf(' ', pos - 1) + 1;
  const trozo = texto.slice(desde, pos);
  const comando = texto.slice(0, desde).trim().split(/\s+/)[0] || '';
  let lista;
  if (!comando) lista = COMANDOS_TAB();
  else if (trozo.startsWith('-')) lista = (OPCIONES_CMD[comando] || '').split(' ').filter(Boolean);
  else {
    // Rutas: se completa el último trozo y se respeta lo escrito delante ("~/", "Documentos/", "../")
    const corte = trozo.lastIndexOf('/');
    const cabeza = trozo.slice(0, corte + 1), base = trozo.slice(corte + 1);
    if (base === '~' || base === '.' || base === '..') lista = [base + '/'];
    else {
      const dir = rutaAbs(cabeza || '.', estado ? estado.cwd : MUNDO_HOME);
      const real = estado ? resolverEnlace(estado, dir) : dir;
      const nombres = estado && esDir(estado, real) ? listarHijos(estado, dir, base.startsWith('.')).map(nombreDe) : [];
      lista = nombres.map(nombre => {
        const p = dir + '/' + nombre;
        return cabeza + nombre + (esDir(estado, resolverEnlace(estado, p)) ? '/' : '');
      });
    }
  }
  return { desde, trozo, lista: [...new Set(lista)].filter(x => x.startsWith(trozo)) };
}

// Aplica Tab sobre un input. Si hay varias opciones, escribe la lista con salida(html), como bash.
function completarInput(inp, estado, salida){
  const texto = inp.value, pos = inp.selectionStart;
  const { desde, trozo, lista } = candidatosTab(texto, pos, estado);
  if (!lista.length) return;
  if (lista.length === 1){
    const nuevo = lista[0], espacio = nuevo.endsWith('/') ? '' : ' ';
    inp.value = texto.slice(0, desde) + nuevo + espacio + texto.slice(pos);
    const fin = desde + nuevo.length + espacio.length;
    inp.setSelectionRange(fin, fin);
    return;
  }
  // Varias: se completa hasta donde coinciden; si no se puede avanzar, se listan.
  let comun = lista[0];
  for (const c of lista) while (!c.startsWith(comun)) comun = comun.slice(0, -1);
  if (comun.length > trozo.length){
    inp.value = texto.slice(0, desde) + comun + texto.slice(pos);
    const fin = desde + comun.length;
    inp.setSelectionRange(fin, fin);
  } else salida('<span class="c"># ' + lista.map(escapar).join('   ') + '</span>\n');
}

// Eventos de la terminal de la actividad: Enter, Tab, historial (↑ ↓) y atajos de bash
entradaAct.onkeydown = e => {
  if (e.key === 'Enter'){ e.preventDefault(); enviarAct(); return; }
  if (e.key === 'Tab'){
    e.preventDefault();
    completarInput(entradaAct, estadoAct, html => { histAct += html; pintarAct(); });
    return;
  }
  if (e.ctrlKey || e.metaKey){
    const k = e.key.toLowerCase(), i = entradaAct.selectionStart, j = entradaAct.selectionEnd;
    if (k === 'l'){ e.preventDefault(); histAct = ''; pintarAct(); }          // Ctrl+L: limpiar
    else if (k === 'c' && i === j){                                          // Ctrl+C: cancelar (con selección, copia)
      e.preventDefault();
      histAct += promptHtml(rutaAct || rutaVisible(estadoAct.cwd)) + escapar(entradaAct.value) + '^C\n';
      entradaAct.value = ''; memI = mem.length; pintarAct();
    }
    else if (k === 'u'){ e.preventDefault(); entradaAct.value = entradaAct.value.slice(i); entradaAct.setSelectionRange(0, 0); }   // borra hasta el cursor
    else if (k === 'w'){                                                     // borra la palabra anterior
      e.preventDefault();
      const antes = entradaAct.value.slice(0, i).replace(/\S+\s*$/, '');
      entradaAct.value = antes + entradaAct.value.slice(i);
      entradaAct.setSelectionRange(antes.length, antes.length);
    }
    else if (k === 'a'){ e.preventDefault(); entradaAct.setSelectionRange(0, 0); }
    else if (k === 'e'){ e.preventDefault(); entradaAct.setSelectionRange(entradaAct.value.length, entradaAct.value.length); }
    return;
  }
  if (e.key === 'ArrowUp'){ if (mem.length){ e.preventDefault(); memI = Math.max(0, memI - 1); entradaAct.value = mem[memI]; } }
  else if (e.key === 'ArrowDown'){ e.preventDefault(); memI = Math.min(mem.length, memI + 1); entradaAct.value = mem[memI] ?? ''; }
};
pantAct.onclick = () => { if (!getSelection().toString()) entradaAct.focus(); };
$('act-reiniciar').onclick = reiniciarAct;
// "Ver una solución" (aparece tras 3 fallos): orienta sin rellenar la terminal.
$('act-solucion').onclick = () => {
  if (hechaAct) return;
  const paso = act.pasos[pasoAct], ej = paso.ejemplo;
  if (!ej) return;
  ayudaAct = true;   // este paso dará 5 puntos en vez de 10/15
  histAct += '<span class="c"># Solución del paso ' + (pasoAct + 1) + ': ' + escapar(ej) + '</span>\n';
  if (paso.explica) histAct += '<span class="c"># ' + escapar(quitarHtml([].concat(paso.explica).join(' '))) + '</span>\n';
  histAct += '<span class="c"># La solución no se escribe automáticamente: intenta ahora el comando tú mismo.</span>\n';
  pintarAct(); entradaAct.focus();
};
$('act-pista').onclick = () => {
  if (hechaAct){ if (actI < ORDEN_ACT.length - 1) abrirAct(actI + 1); else cerrarAct(); return; }
  histAct += pistaHtml(act.pasos[pasoAct]); pintarAct(); entradaAct.focus();
};
$('act-cerrar').onclick = cerrarAct;

// Botón de la barra, borrar progreso, clic fuera y Escape
btnAct.onclick = () => alternarAct(!panelAct.classList.contains('abierto'));
$('act-borrar').onclick = () => {
  if (!hechas.length && !Object.keys(progreso).length && !puntos) return;
  if (!confirm('¿Borrar el progreso y los puntos de todas las actividades?')) return;
  hechas = []; progreso = {}; puntos = 0;
  guardarHechas(); guardarProgreso(); guardarPuntos();
  construirLista(); avisar('Progreso borrado');
};
addEventListener('click', e => {
  if (panelAct.classList.contains('abierto') && !panelAct.contains(e.target) && !btnAct.contains(e.target)) alternarAct(false);
});
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!fondoAct.hidden){ cerrarAct(); return; }
  if (panelAct.classList.contains('abierto')){ alternarAct(false); return; }
  if (ventanaPrincipal.classList.contains('minimizada')){ verEscritorio(false); return; }
  alternar(false);
});

construirLista();

aplicar();
if (grupos.length) abrir(0, 0); // comando que se abre al cargar
else {
  $('pantalla').innerHTML = '<span class="c"># No hay comandos cargados. Revisa ejemplos.js.</span>\n';
  $('explicacion').innerHTML = '<h3>No se han podido cargar los comandos</h3><p>Comprueba que <code>ejemplos.js</code> está en la misma carpeta que este HTML y que no tiene errores de sintaxis.</p>';
}
</script>
